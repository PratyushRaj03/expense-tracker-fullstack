<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-message {
            text-align: center;
            padding: 24px;
            background: var(--brand-sage, #DCE7DD);
            border: 1px solid var(--brand-primary, #245B48);
            border-radius: var(--radius-md, 10px);
            color: var(--brand-primary, #245B48);
            margin: 20px 0;
        }
        
        .reset-message i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
            color: var(--brand-primary, #245B48);
        }
        
        .reset-message h3 {
            font-family: var(--font-serif, 'Newsreader', serif);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary, #242A27);
        }
        
        .reset-message p {
            font-size: 13.5px;
            color: var(--text-secondary, #57635C);
            line-height: 1.5;
        }
        
        .info-text {
            font-size: 13px;
            color: var(--text-muted, #7C8A82);
            margin-top: 16px;
            text-align: center;
            line-height: 1.5;
        }
        
        body.dark-mode .reset-message {
            background: rgba(55, 119, 96, 0.15);
            border-color: var(--brand-primary, #377760);
        }

        body.dark-mode .reset-message h3 {
            color: var(--text-primary, #F5F3ED);
        }

        body.dark-mode .reset-message p {
            color: var(--text-secondary, #A2B0A8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h2>ExpenseTracker</h2>
            </div>

            <div class="header">
                <h1>Reset Password</h1>
                <p>Enter your email to receive recovery instructions</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="login-form">
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="input-field">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your registered email"
                            required
                        >
                        <div class="input-highlight"></div>
                        <div class="error-message" id="emailError"></div>
                    </div>
                </div>

                <!-- Success Message (hidden by default) -->
                <div id="successMessage" class="reset-message" style="display: none;">
                    <i class="fas fa-check-circle"></i>
                    <h3>Check Your Email</h3>
                    <p>We've sent a password reset link to your email address.</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="login-btn" id="resetBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </span>
                </button>

                <p class="info-text">
                    You'll receive a secure link to reset your account password.
                </p>

                <!-- Back to Login Link -->
                <p class="signup-text">
                    <a href="index.html" id="backToLogin">
                        <i class="fas fa-arrow-left"></i> Back to Login
                    </a>
                </p>
            </form>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-errors.js"></script>
    <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
