<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Quantum Vault Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fas fa-cube"></i>
                </div>
                <h2>QUANTUM // LEDGER</h2>
            </div>

            <div class="header">
                <div class="telemetry-tag">
                    <span class="telemetry-beacon"></span>
                    <span>SECURE QUANTUM PROTOCOL</span>
                </div>
                <h1>System Access</h1>
                <p>Authenticate credentials to decrypt your autonomous wealth ledger</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-terminal"></i>
                    </div>
                    <div class="input-field">
                        <label for="email">Operator Email Identifier</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="operator@quantum.vault"
                            required
                        >
                        <div class="input-highlight"></div>
                        <div class="error-message" id="emailError"></div>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="input-field">
                        <label for="password">Passcode Authorization</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="••••••••••••"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-highlight"></div>
                        <div class="error-message" id="passwordError"></div>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="remember">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">Retain cached session</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link" id="forgotPassword">Recover key?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">INITIALIZE DECRYPT</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </span>
                </button>

                <p class="signup-text">
                    New operator? 
                    <a href="signup.html" id="signupLink">Deploy new ledger node</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth-errors.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
