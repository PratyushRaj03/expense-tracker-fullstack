<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Deploy Quantum Node</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fas fa-cube"></i>
                </div>
                <h2>QUANTUM // LEDGER</h2>
            </div>

            <div class="header">
                <div class="telemetry-tag">
                    <span class="telemetry-beacon"></span>
                    <span>NEW NODE PROVISIONING</span>
                </div>
                <h1>Deploy Node</h1>
                <p>Provision your encrypted personal wealth ledger</p>
            </div>

            <form id="signupForm" class="login-form" novalidate>
                <!-- Name field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-user-astronaut"></i>
                    </div>
                    <div class="input-field">
                        <label for="name">Operator Designation / Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="Operator Name"
                            required
                        >
                        <div class="input-highlight"></div>
                        <div class="error-message" id="nameError"></div>
                    </div>
                </div>

                <!-- Email field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-satellite-dish"></i>
                    </div>
                    <div class="input-field">
                        <label for="email">Communication Channel / Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="operator@quantum.vault"
                            required
                        >
                        <div class="input-highlight"></div>
                        <div class="error-message" id="emailError"></div>
                    </div>
                </div>

                <!-- Password field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <div class="input-field">
                        <label for="password">Cryptographic Master Key</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Min 8 chars (upper, lower, num, sym)"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-highlight"></div>
                        <div class="error-message" id="passwordError"></div>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>
                </div>

                <!-- Confirm Password field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="input-field">
                        <label for="confirmPassword">Verify Master Key</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="Re-enter Master Key"
                                required
                            >
                            <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-highlight"></div>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>
                </div>

                <!-- Terms and conditions checkbox -->
                <div class="form-options">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="terms" required>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">
                            I verify compliance with 
                            <a href="#" id="termsLink">Protocols</a> 
                            and 
                            <a href="#" id="privacyLink">Data Privacy</a>
                        </span>
                    </label>
                </div>

                <!-- Signup button -->
                <button type="submit" class="login-btn" id="signupBtn">
                    <span class="btn-text">PROVISION QUANTUM NODE</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </span>
                </button>
            </form>

            <!-- Login link -->
            <p class="signup-text">
                Node already deployed? 
                <a href="index.html" id="loginLink">Access Console</a>
            </p>
        </div>
    </div>

    <!-- Terms and Privacy Policy Modal -->
    <div id="policyModal" class="modal">
        <div class="modal-content policy-modal-content">
            <div class="modal-header">
                <h3 id="policyModalTitle">System Protocol Terms</h3>
                <span class="close-modal" id="closePolicyModal">&times;</span>
            </div>
            <div class="policy-modal-body" id="policyModalBody">
                <!-- Content will be loaded dynamically -->
            </div>
            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="closePolicyBtn">Acknowledge</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="import">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        
        window.initializeApp = initializeApp;
        window.getAuth = getAuth;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    </script>

    <script type="module" src="js/auth-errors.js"></script>
    <script type="module" src="js/signup.js"></script>

    <!-- Modal Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('policyModal');
            const modalTitle = document.getElementById('policyModalTitle');
            const modalBody = document.getElementById('policyModalBody');
            const closeBtn = document.getElementById('closePolicyModal');
            const closeFooterBtn = document.getElementById('closePolicyBtn');
            const termsLink = document.getElementById('termsLink');
            const privacyLink = document.getElementById('privacyLink');
            
            const termsContent = `
                <h4>Autonomous System Protocols</h4>
                <p>Telemetry Timestamp: ${new Date().toISOString()}</p>
                
                <h5>1. Node Operator Responsibility</h5>
                <p>Operators are solely responsible for safeguard of authentication tokens and master keys. Access privileges are granted under zero-trust verification.</p>
                
                <h5>2. Cryptographic Data Isolation</h5>
                <p>All financial records are encapsulated in isolated Firestore collections keyed to verified UID tokens. Cross-node enumeration is rejected by server security rules.</p>
                
                <h5>3. Zero-Knowledge Analytics</h5>
                <p>Telemetry calculations execute client-side. No third-party data tracking, ad networks, or invasive analytics engines are permitted.</p>
            `;
            
            const privacyContent = `
                <h4>Privacy & Data Sovereign Architecture</h4>
                <p>Telemetry Timestamp: ${new Date().toISOString()}</p>
                
                <h5>1. Encrypted Storage Parameters</h5>
                <ul>
                    <li>Operator credential mapping: RFC-5322 verified email identity</li>
                    <li>Financial telemetry: Amounts, categories, dates, and encrypted descriptions</li>
                </ul>
                
                <h5>2. Security Protocols</h5>
                <ul>
                    <li>TLS 1.3 cryptographic transport with HSTS enforcement</li>
                    <li>Sub-collection granular security boundary enforcement</li>
                    <li>Automated brute-force attack deterrence and rate limiting</li>
                </ul>
            `;
            
            function openModal(title, content) {
                modalTitle.textContent = title;
                modalBody.innerHTML = content;
                modal.classList.add('show');
                modal.style.display = 'flex';
            }
            
            function closeModal() {
                modal.classList.remove('show');
                modal.style.display = 'none';
            }
            
            if (termsLink) {
                termsLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal('System Protocol Terms', termsContent);
                });
            }
            
            if (privacyLink) {
                privacyLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal('Privacy & Data Sovereignty', privacyContent);
                });
            }
            
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (closeFooterBtn) closeFooterBtn.addEventListener('click', closeModal);
            
            window.addEventListener('click', function(event) {
                if (event.target === modal) closeModal();
            });
            
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && modal.classList.contains('show')) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
