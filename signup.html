<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker | Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Policy Modal Styles matching Editorial Fintech */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(36, 42, 39, 0.45);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex !important;
        }

        .modal-content {
            background: var(--surface, #FFFFFF);
            border-radius: var(--radius-lg, 14px);
            box-shadow: var(--shadow-modal, 0 16px 36px rgba(36, 42, 39, 0.12));
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            animation: modalSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border, #E5E1D8);
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border, #E5E1D8);
        }

        .modal-header h3 {
            font-family: var(--font-serif, 'Newsreader', serif);
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary, #242A27);
            margin: 0;
        }

        .close-modal {
            font-size: 22px;
            font-weight: 400;
            color: var(--text-muted, #7C8A82);
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm, 6px);
            transition: all 0.2s ease;
        }

        .close-modal:hover {
            background: var(--surface-alt, #FAF8F5);
            color: var(--brand-primary, #245B48);
        }

        .policy-modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: 50vh;
            line-height: 1.6;
            color: var(--text-secondary, #57635C);
            font-size: 13.5px;
        }

        .policy-modal-body h4 {
            font-family: var(--font-serif, 'Newsreader', serif);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary, #242A27);
            margin: 0 0 14px 0;
        }

        .policy-modal-body h5 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary, #242A27);
            margin: 18px 0 8px 0;
            letter-spacing: -0.2px;
        }

        .policy-modal-body p {
            margin-bottom: 12px;
        }

        .policy-modal-body ul {
            margin: 8px 0 16px 20px;
        }

        .policy-modal-body li {
            margin-bottom: 6px;
        }

        .modal-actions {
            padding: 16px 24px;
            border-top: 1px solid var(--border, #E5E1D8);
            display: flex;
            justify-content: flex-end;
        }

        .modal-actions .cancel-btn {
            padding: 10px 22px;
            background: var(--surface-alt, #FAF8F5);
            color: var(--text-primary, #242A27);
            border: 1px solid var(--border, #E5E1D8);
            border-radius: var(--radius-sm, 6px);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-actions .cancel-btn:hover {
            background: var(--border, #E5E1D8);
        }

        body.dark-mode .modal {
            background-color: rgba(0, 0, 0, 0.7);
        }

        body.dark-mode .modal-content {
            background: var(--surface, #1F2421);
            border-color: var(--border, #2D3530);
        }

        body.dark-mode .modal-header {
            border-bottom-color: var(--border, #2D3530);
        }

        body.dark-mode .modal-header h3 {
            color: var(--text-primary, #F5F3ED);
        }

        body.dark-mode .close-modal {
            color: var(--text-muted, #6E7C74);
        }

        body.dark-mode .close-modal:hover {
            background: var(--surface-alt, #272F2B);
            color: var(--text-primary, #F5F3ED);
        }

        body.dark-mode .policy-modal-body {
            color: var(--text-secondary, #A2B0A8);
        }

        body.dark-mode .policy-modal-body h4,
        body.dark-mode .policy-modal-body h5 {
            color: var(--text-primary, #F5F3ED);
        }

        body.dark-mode .modal-actions {
            border-top-color: var(--border, #2D3530);
        }

        body.dark-mode .modal-actions .cancel-btn {
            background: var(--surface-alt, #272F2B);
            color: var(--text-primary, #F5F3ED);
            border-color: var(--border, #2D3530);
        }

        body.dark-mode .modal-actions .cancel-btn:hover {
            background: var(--border-strong, #3E4B43);
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <div class="container">
        <!-- Signup card -->
        <div class="login-card">
            <!-- Logo section -->
            <div class="logo-wrapper">
                <div class="logo">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h2>ExpenseTracker</h2>
            </div>

            <!-- Header section -->
            <div class="header">
                <h1>Create account</h1>
                <p>Begin your curated personal wealth ledger</p>
            </div>

            <!-- Signup form -->
            <form id="signupForm" class="login-form" novalidate>
                <!-- Name field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="input-field">
                        <label for="name">Full Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="Enter your full name"
                            required
                        >
                        <div class="input-highlight"></div>
                        <div class="error-message" id="nameError"></div>
                    </div>
                </div>

                <!-- Email field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="input-field">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email"
                            required
                        >
                        <div class="input-highlight"></div>
                        <div class="error-message" id="emailError"></div>
                    </div>
                </div>

                <!-- Password field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="input-field">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Create a password"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-highlight"></div>
                        <div class="error-message" id="passwordError"></div>
                        <!-- Password strength indicator -->
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>
                </div>

                <!-- Confirm Password field -->
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="input-field">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="Confirm your password"
                                required
                            >
                            <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Toggle password visibility">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="input-highlight"></div>
                        <div class="error-message" id="confirmPasswordError"></div>
                    </div>
                </div>

                <!-- Terms and conditions checkbox -->
                <div class="form-options">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="terms" required>
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">
                            I agree to the 
                            <a href="#" id="termsLink">Terms</a> 
                            and 
                            <a href="#" id="privacyLink">Privacy Policy</a>
                        </span>
                    </label>
                </div>

                <!-- Signup button -->
                <button type="submit" class="login-btn" id="signupBtn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </span>
                </button>
            </form>

            <!-- Login link -->
            <p class="signup-text">
                Already have an account? 
                <a href="index.html" id="loginLink">Sign in</a>
            </p>
        </div>
    </div>

    <!-- Terms and Privacy Policy Modal -->
    <div id="policyModal" class="modal">
        <div class="modal-content policy-modal-content">
            <div class="modal-header">
                <h3 id="policyModalTitle">Terms & Conditions</h3>
                <span class="close-modal" id="closePolicyModal">&times;</span>
            </div>
            <div class="policy-modal-body" id="policyModalBody">
                <!-- Content will be loaded dynamically -->
            </div>
            <div class="modal-actions">
                <button type="button" class="cancel-btn" id="closePolicyBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="import">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        
        window.initializeApp = initializeApp;
        window.getAuth = getAuth;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
    </script>

    <script type="module" src="js/auth-errors.js"></script>
    <script type="module" src="js/signup.js"></script>

    <!-- Modal Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('policyModal');
            const modalTitle = document.getElementById('policyModalTitle');
            const modalBody = document.getElementById('policyModalBody');
            const closeBtn = document.getElementById('closePolicyModal');
            const closeFooterBtn = document.getElementById('closePolicyBtn');
            const termsLink = document.getElementById('termsLink');
            const privacyLink = document.getElementById('privacyLink');
            
            const termsContent = `
                <h4>Terms and Conditions</h4>
                <p>Last updated: ${new Date().toLocaleDateString()}</p>
                
                <h5>1. Acceptance of Terms</h5>
                <p>By accessing and using this Expense Tracker application, you agree to be bound by these Terms and Conditions.</p>
                
                <h5>2. User Accounts</h5>
                <p>You are responsible for maintaining the confidentiality of your account credentials and for all activities performed under your account.</p>
                
                <h5>3. Financial Data Isolation</h5>
                <p>We store your financial records strictly isolated by your authenticated user ID in Firebase Cloud Firestore. Your financial transactions are never accessible to other accounts.</p>
                
                <h5>4. Privacy</h5>
                <p>Your financial records are strictly private. We do not sell, monetize, or disclose your financial records to any third party.</p>
                
                <h5>5. Service Availability</h5>
                <p>We strive to maintain maximum uptime and data integrity using Google Cloud infrastructure.</p>
            `;
            
            const privacyContent = `
                <h4>Privacy Policy</h4>
                <p>Last updated: ${new Date().toLocaleDateString()}</p>
                
                <h5>1. Information We Store</h5>
                <ul>
                    <li><strong>Account Credentials:</strong> Full name and verified email address</li>
                    <li><strong>Financial Records:</strong> Transaction amounts, categories, descriptions, and timestamps</li>
                </ul>
                
                <h5>2. How Your Data Is Protected</h5>
                <ul>
                    <li>All data transmitted over TLS 1.3 with Strict-Transport-Security</li>
                    <li>Enforced Firestore Security Rules with UID-level isolation</li>
                    <li>Automatic rate-limiting protection against brute force attacks</li>
                </ul>
                
                <h5>3. Your Rights & Portability</h5>
                <p>You have full ownership of your financial data. You may export your entire transaction history to CSV or PDF at any time, or modify and delete individual records directly from the ledger.</p>
            `;
            
            function openModal(title, content) {
                modalTitle.textContent = title;
                modalBody.innerHTML = content;
                modal.classList.add('show');
                modal.style.display = 'flex';
            }
            
            function closeModal() {
                modal.classList.remove('show');
                modal.style.display = 'none';
            }
            
            if (termsLink) {
                termsLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal('Terms & Conditions', termsContent);
                });
            }
            
            if (privacyLink) {
                privacyLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    openModal('Privacy Policy', privacyContent);
                });
            }
            
            if (closeBtn) closeBtn.addEventListener('click', closeModal);
            if (closeFooterBtn) closeFooterBtn.addEventListener('click', closeModal);
            
            window.addEventListener('click', function(event) {
                if (event.target === modal) closeModal();
            });
            
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && modal.classList.contains('show')) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
